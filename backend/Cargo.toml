[package]
name = "furfiles"
version = "0.2.0"
edition = "2021"
description = "FurFiles backend — self-hosted pet records API"
license = "MIT"

[lib]
name = "furfiles"
path = "src/lib.rs"

[[bin]]
name = "furfiles"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# LLM document ingestion (#4). rustls (not native-tls) so the slim runtime image
# needs no OpenSSL; the API key never leaves the backend in plaintext. Since
# reqwest 0.13 `rustls` verifies against the OS trust store
# (rustls-platform-verifier), so DO NOT drop `ca-certificates` from the runtime
# image: every HTTPS call (Anthropic, facility websites) would fail. `query` is
# the model-list `?limit=` builder, a separate feature since 0.13.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
chacha20poly1305 = "0.11"
rand = "0.10"
base64 = "0.23"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
# MCP server (#22): the official Rust SDK, Streamable HTTP served from the same
# Axum app. `server` + `macros` for the #[tool] router.
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
